[project]
name = "scamtrace"
version = "0.1.0"
description = "Links payees to live advert-originated scam campaigns (prototype)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "beautifulsoup4", "lxml", "playwright>=1.44"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
