[project]
name = "scamtrace"
version = "0.3.0"
description = "Links payees to live advert-originated scam campaigns (prototype)"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "beautifulsoup4", "lxml", "playwright>=1.44", "anthropic>=0.40", "httpx>=0.27", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]



[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scamtrace"]
